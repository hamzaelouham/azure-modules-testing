---
- name: Install and configure containerd
  hosts: all
  become: true
  tasks:
    - name: Create the apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add the Docker apt repository (provides containerd.io)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      register: containerd_docker_repo

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: "{{ containerd_docker_repo is changed }}"
        cache_valid_time: 3600

    - name: Read the default containerd configuration
      ansible.builtin.command: containerd config default
      changed_when: false
      register: containerd_default_config

    - name: Check that the default configuration has a SystemdCgroup setting to enable
      ansible.builtin.assert:
        that: "'SystemdCgroup = ' in containerd_default_config.stdout"
        fail_msg: containerd's default configuration has no SystemdCgroup setting; update this playbook for the new format.
        quiet: true

    - name: Write the containerd configuration with the systemd cgroup driver
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
        owner: root
        group: root
        mode: "0644"
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: started
        enabled: true

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
