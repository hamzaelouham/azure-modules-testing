---
- name: Install kubelet, kubeadm and kubectl
  hosts: all
  become: true
  vars:
    kube_packages:
      - kubelet
      - kubeadm
      - kubectl
  tasks:
    - name: Download the Kubernetes apt key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add the Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /\n"
        owner: root
        group: root
        mode: "0644"
      register: kube_repo

    - name: Install the Kubernetes packages
      ansible.builtin.apt:
        name: "{{ kube_packages }}"
        state: present
        update_cache: "{{ kube_repo is changed }}"
        cache_valid_time: 3600

    - name: Hold the Kubernetes packages at their installed version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ kube_packages }}"

    - name: Enable and start kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: started
        enabled: true
