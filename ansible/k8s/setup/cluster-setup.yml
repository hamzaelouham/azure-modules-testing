---
- name: Initialize the control plane
  hosts: master
  become: true
  tasks:
    - name: Initialize the control plane with kubeadm
      # ansible_host is the master's public IP when it has one, so kubectl can
      # reach the API server from outside the VNet.
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --pod-network-cidr={{ k8s_pod_network_cidr }}
          - --apiserver-cert-extra-sans={{ ansible_host | default(inventory_hostname) }}
        creates: /etc/kubernetes/admin.conf

    - name: Create the .kube directory for the admin user
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy the admin kubeconfig for the admin user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Install the Flannel pod network
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - https://github.com/flannel-io/flannel/releases/download/{{ k8s_flannel_version }}/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_flannel_apply
      changed_when: "'created' in cluster_flannel_apply.stdout or 'configured' in cluster_flannel_apply.stdout"

    - name: Create a join command for the workers
      ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
      register: cluster_join_command
      changed_when: false
      no_log: true

- name: Join the workers to the cluster
  hosts: worker
  become: true
  tasks:
    - name: Join the cluster with kubeadm
      ansible.builtin.command: "{{ hostvars[groups['master'][0]]['cluster_join_command']['stdout'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      no_log: true

- name: Check the cluster
  hosts: master
  become: true
  tasks:
    - name: Wait for every node to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false
